# ==============================================================================
# FenixAI Trading Bot - Docker Compose
# ==============================================================================
# Usage:
#   docker compose up -d
#   docker compose --profile monitoring up -d
# ==============================================================================

services:
  # =============================================================================
  # FenixAI API Server
  # =============================================================================
  fenix-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.13}
    container_name: fenix-api
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FENIX_API_HOST_PORT:-8001}:8000"
    environment:
      # Keep the container port stable; FENIX_API_HOST_PORT controls publishing.
      FENIX_API_PORT: "8000"
      # Database
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/fenix.db}
      # Secrets from .env file
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Ollama connection (for local LLM)
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CREATE_DEMO_USERS: ${CREATE_DEMO_USERS:-false}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_DEMO_PASSWORD: ${DEFAULT_DEMO_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://:${REDIS_PASSWORD:-fenix_redis_change_me}@redis:6379/0
      FENIX_REDIS_CHANNEL: ${FENIX_REDIS_CHANNEL:-fenix_socketio}
      # Prometheus
      PROMETHEUS_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - fenix-network
    depends_on:
      redis:
        condition: service_healthy

  # =============================================================================
  # Prometheus - Metrics Collection
  # =============================================================================
  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: fenix-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - fenix-network
    depends_on:
      fenix-api:
        condition: service_healthy

  # =============================================================================
  # Grafana - Visualization
  # =============================================================================
  grafana:
    image: grafana/grafana:13.1.0
    container_name: fenix-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fenix_admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - fenix-network
    depends_on:
      - prometheus

  # =============================================================================
  # Redis - Cache & Session Store (Optional)
  # =============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: fenix-redis
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fenix_redis_change_me}
    volumes:
      - redis-data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fenix-network

# =============================================================================
# Networks
# =============================================================================
networks:
  fenix-network:
    name: fenix-network
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  prometheus-data:
  grafana-data:
  redis-data:
