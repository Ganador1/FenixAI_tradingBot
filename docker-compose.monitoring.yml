# FenixAI Monitoring Stack
# Prefer the integrated stack:
#   docker compose --profile monitoring up -d
#
# Compatibility mode for an already-running Fenix API stack:
#   docker compose -f docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: fenix-prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      FENIX_METRICS_TOKEN: ${FENIX_METRICS_TOKEN:?FENIX_METRICS_TOKEN is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        test "$${#FENIX_METRICS_TOKEN}" -ge 32 || {
          echo "FENIX_METRICS_TOKEN must contain at least 32 characters" >&2
          exit 78
        }
        printf '%s' "$$FENIX_METRICS_TOKEN" > /tmp/fenix_metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus
    networks:
      - fenix-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    pids_limit: 256

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: fenix-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
    networks:
      - fenix-network
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    pids_limit: 256

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  fenix-network:
    external: true
    name: fenix-network
